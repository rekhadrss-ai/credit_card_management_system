{% extends "admin/base_site.html" %}
{% block content %}
<table style="width:100%">
  <thead>
    <tr><th>Date</th><th>Total</th><th>Success</th><th>Failed</th><th>Successful Amount</th></tr>
  </thead>
  <tbody>
  {% for r in rows %}
    <tr>
      <td>{{ r.day }}</td><td>{{ r.total }}</td><td>{{ r.success }}</td>
      <td>{{ r.failed }}</td><td>{{ r.amount|default:"0" }}</td>
    </tr>
  {% empty %}
    <tr><td colspan="5">No transactions yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
