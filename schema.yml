          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/transactions/:
    get:
      operationId: transactions_list
      tags:
      - transactions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
          description: ''
  /api/transactions/export/:
    get:
      operationId: transactions_export_retrieve
      tags:
      - transactions
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/transactions/payment-docs/:
    post:
      operationId: transactions_payment_docs_create
      description: Documentation only. The real payment runs on FastAPI at http://127.0.0.1:8001/api/payments/
      summary: Make payment (served by FastAPI on port 8001)
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentDoc'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentDoc'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentDoc'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    Card:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        card_holder:
          type: string
          maxLength: 100
        card_type:
          $ref: '#/components/schemas/CardTypeEnum'
        card_number:
          type: string
          writeOnly: true
        masked_number:
          type: string
          readOnly: true
        last4:
          type: string
          readOnly: true
        expiry_month:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        expiry_year:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - card_holder
      - card_number
      - card_type
      - created_at
      - expiry_month
      - expiry_year
      - id
      - last4
      - masked_number
    CardTypeEnum:
      enum:
      - CREDIT
      - DEBIT
      type: string
      description: |-
        * `CREDIT` - Credit
        * `DEBIT` - Debit
    PaymentDoc:
      type: object
      properties:
        card_id:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        description:
          type: string
      required:
      - amount
      - card_id
    Register:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 15
        password:
          type: string
          writeOnly: true
          minLength: 6
      required:
      - email
      - id
      - password
      - username
    StatusEnum:
      enum:
      - PENDING
      - SUCCESS
      - FAILED
      type: string
      description: |-
        * `PENDING` - Pending
        * `SUCCESS` - Success
        * `FAILED` - Failed
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    Transaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        card:
          type: integer
          nullable: true
        card_number:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/StatusEnum'
        description:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - card_number
      - created_at
      - id
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
